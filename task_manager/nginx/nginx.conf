# ==============================================================================
# Nginx Load Balancer & Reverse Proxy Configuration
# Distributes traffic across horizontally scaled Django/Gunicorn instances
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # 1. Define Upstream Cluster (Horizontal Scaling)
    # Nginx distributes traffic across these backend instances via Round-Robin
    upstream django_cluster {
        # Backend Gunicorn worker instances
        server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 weight=1 max_fails=3 fail_timeout=10s;

        # Keepalive connection pool to backends
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Maximum payload size (protects against huge payload DOS)
        client_max_body_size 10M;

        # 2. Static Files (Served directly by Nginx at line-rate without waking Python)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # 3. Health Check for AWS ALB / External Liveness Monitoring
        location /health/ {
            proxy_pass http://django_cluster/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # 4. Reverse Proxy for API & Web Application
        location / {
            proxy_pass http://django_cluster;

            # Critical Proxy Headers: preserves real client IP & SSL protocol
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # HTTP 1.1 keepalive optimization
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
