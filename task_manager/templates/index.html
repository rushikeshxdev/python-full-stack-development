<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - API Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --primary: #238636;
      --primary-hover: #2ea043;
      --blue: #58a6ff;
      --purple: #bc8cff;
      --amber: #d29922;
      --red: #f85149;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 0 0 80px 0;
    }

    /* Top Navigation Bar */
    .navbar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: var(--text-bright);
      text-decoration: none;
      font-size: 1.1rem;
    }

    .brand-badge {
      font-size: 0.7rem;
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--blue);
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: #21262d;
      transition: all 0.15s;
    }

    .nav-link:hover {
      color: var(--text-bright);
      background: #30363d;
    }

    .nav-link.highlight {
      background: #1f6feb;
      border-color: #388bfd;
      color: #fff;
    }

    .nav-link.highlight:hover {
      background: #388bfd;
    }

    /* Main Container */
    .container {
      max-width: 1040px;
      margin: 24px auto 0;
      padding: 0 20px;
    }

    /* Metrics Row */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 680px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 14px 16px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .metric-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    /* Form Panel */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      margin-bottom: 24px;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      padding: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-desc {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input, select, textarea {
      background: #0d1117;
      border: 1px solid var(--card-border);
      color: var(--text-bright);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #58a6ff;
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      height: 35px;
      white-space: nowrap;
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Control Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .tab {
      background: #21262d;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border-right: 1px solid var(--card-border);
    }

    .tab:last-child { border-right: none; }

    .tab.active {
      background: #30363d;
      color: var(--text-bright);
      font-weight: 600;
    }

    .search-input {
      min-width: 260px;
    }

    /* Tasks List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .task-card.is-done {
      border-color: #21262d;
      opacity: 0.75;
    }

    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .task-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-bright);
      word-break: break-word;
    }

    .is-done .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .task-meta {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Right Action Bar */
    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid transparent;
      text-transform: uppercase;
    }

    .badge-HIGH { background: rgba(248, 81, 73, 0.15); border-color: rgba(248, 81, 73, 0.4); color: var(--red); }
    .badge-MEDIUM { background: rgba(210, 153, 34, 0.15); border-color: rgba(210, 153, 34, 0.4); color: var(--amber); }
    .badge-LOW { background: rgba(88, 166, 255, 0.15); border-color: rgba(88, 166, 255, 0.4); color: var(--blue); }

    .status-select {
      background: #21262d;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.75rem;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .btn-action {
      background: #21262d;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-action:hover {
      background: #30363d;
      color: var(--text-bright);
    }

    .btn-action.delete:hover {
      background: rgba(248, 81, 73, 0.2);
      border-color: var(--red);
      color: var(--red);
    }

    .empty {
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 6px;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Modal for Editing */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }

    .modal-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-footer {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-secondary {
      background: #21262d;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="navbar">
    <div class="brand">
      <span>Task Manager</span>
      <span class="brand-badge">REST API Client</span>
    </div>
    <div class="nav-links">
      <a href="/api/docs/" target="_blank" class="nav-link highlight">📄 Swagger UI</a>
      <a href="/api/tasks/" target="_blank" class="nav-link">⚡ Raw API</a>
      <a href="/admin/" target="_blank" class="nav-link">⚙️ Admin</a>
    </div>
  </nav>

  <div class="container">

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Total Tasks</div>
        <div class="metric-number" id="count-total">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">To Do</div>
        <div class="metric-number" id="count-todo" style="color: var(--blue);">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">In Progress</div>
        <div class="metric-number" id="count-in-progress" style="color: var(--amber);">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Done</div>
        <div class="metric-number" id="count-done" style="color: var(--primary);">0</div>
      </div>
    </div>

    <!-- Create Task Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Create Task</span>
      </div>
      <div class="panel-body">
        <form id="create-form" onsubmit="createTask(event)">
          <div class="form-row">
            <div class="field">
              <label for="new-title">Title *</label>
              <input type="text" id="new-title" placeholder="e.g. Implement PostgreSQL schema" required>
            </div>
            <div class="field">
              <label for="new-status">Status</label>
              <select id="new-status">
                <option value="TODO" selected>To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="DONE">Done</option>
              </select>
            </div>
            <div class="field">
              <label for="new-priority">Priority</label>
              <select id="new-priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
            <div class="field">
              <label for="new-due-date">Due Date</label>
              <input type="date" id="new-due-date">
            </div>
            <button type="submit" class="btn-primary">+ Add Task</button>

            <div class="field field-desc">
              <label for="new-desc">Description (optional)</label>
              <input type="text" id="new-desc" placeholder="Details about this task...">
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Controls (Tabs + Search) -->
    <div class="controls">
      <div class="tabs">
        <button class="tab active" data-status="" onclick="switchTab(this, '')">All</button>
        <button class="tab" data-status="TODO" onclick="switchTab(this, 'TODO')">To Do</button>
        <button class="tab" data-status="IN_PROGRESS" onclick="switchTab(this, 'IN_PROGRESS')">In Progress</button>
        <button class="tab" data-status="DONE" onclick="switchTab(this, 'DONE')">Done</button>
      </div>

      <input 
        type="text" 
        class="search-input" 
        placeholder="Search tasks by title or description..." 
        oninput="searchTasks(this.value)"
      >
    </div>

    <!-- Task Items List -->
    <div class="task-list" id="task-list">
      <!-- Injected by JS fetch() -->
    </div>

  </div>

  <!-- Edit Task Modal -->
  <div class="modal-backdrop" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <span>Edit Task #<span id="edit-id-label"></span></span>
        <button onclick="closeEditModal()" style="background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;">&times;</button>
      </div>
      <form id="edit-form" onsubmit="saveEdit(event)">
        <input type="hidden" id="edit-id">
        <div class="modal-body">
          <div class="field">
            <label for="edit-title">Title *</label>
            <input type="text" id="edit-title" required>
          </div>
          <div class="field">
            <label for="edit-desc">Description</label>
            <textarea id="edit-desc" rows="3"></textarea>
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="field">
              <label for="edit-status">Status</label>
              <select id="edit-status">
                <option value="TODO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="DONE">Done</option>
              </select>
            </div>
            <div class="field">
              <label for="edit-priority">Priority</label>
              <select id="edit-priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="edit-due-date">Due Date</label>
            <input type="date" id="edit-due-date">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '/api/v1/tasks/';
    let activeStatus = '';
    let searchQuery = '';
    let searchDebounce = null;
    let cachedTasks = [];

    document.addEventListener('DOMContentLoaded', () => {
      fetchTasks();
    });

    async function fetchTasks() {
      let url = `${API_BASE}?ordering=-created_at`;
      if (activeStatus) url += `&status=${activeStatus}`;
      if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const tasks = data.results || [];
        cachedTasks = tasks;
        renderList(tasks);
        updateCounters();
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    async function updateCounters() {
      try {
        const res = await fetch(`${API_BASE}metrics/`);
        const m = await res.json();
        document.getElementById('count-total').textContent = m.total ?? 0;
        document.getElementById('count-todo').textContent = m.todo ?? 0;
        document.getElementById('count-in-progress').textContent = m.in_progress ?? 0;
        document.getElementById('count-done').textContent = m.completed ?? 0;
      } catch (e) {}
    }

    function renderList(tasks) {
      const container = document.getElementById('task-list');

      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <p>No tasks match your filter.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tasks.map(task => {
        const isDone = task.status === 'DONE';
        return `
          <div class="task-card ${isDone ? 'is-done' : ''}" id="card-${task.id}">
            <div class="task-main">
              <input 
                type="checkbox" 
                ${isDone ? 'checked' : ''} 
                onchange="toggleDone(${task.id}, '${task.status}')"
                style="margin-top: 3px; cursor: pointer; accent-color: var(--primary);"
                title="Mark Done"
              >
              <div class="task-info">
                <div class="task-heading">
                  <span class="task-id">#${task.id}</span>
                  <span class="task-title">${escape(task.title)}</span>
                </div>
                ${task.description ? `<p class="task-desc">${escape(task.description)}</p>` : ''}
                <div class="task-meta">
                  ${task.due_date ? `<span>📅 Due: ${task.due_date}</span>` : ''}
                  <span>Created: ${new Date(task.created_at).toLocaleDateString()}</span>
                </div>
              </div>
            </div>

            <div class="task-actions">
              <span class="badge badge-${task.priority}">${task.priority}</span>
              
              <select class="status-select" onchange="changeStatus(${task.id}, this.value)">
                <option value="TODO" ${task.status === 'TODO' ? 'selected' : ''}>To Do</option>
                <option value="IN_PROGRESS" ${task.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                <option value="DONE" ${task.status === 'DONE' ? 'selected' : ''}>Done</option>
              </select>

              <button class="btn-action" onclick="openEditModal(${task.id})">Edit</button>
              <button class="btn-action delete" onclick="deleteTask(${task.id})">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function createTask(e) {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const desc = document.getElementById('new-desc').value.trim();
      const status = document.getElementById('new-status').value;
      const priority = document.getElementById('new-priority').value;
      const dueDate = document.getElementById('new-due-date').value || null;

      if (!title) return;

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: title,
            description: desc,
            status: status,
            priority: priority,
            due_date: dueDate
          })
        });

        if (res.ok) {
          document.getElementById('new-title').value = '';
          document.getElementById('new-desc').value = '';
          document.getElementById('new-due-date').value = '';

          if (activeStatus && activeStatus !== status) {
            const matchingTab = document.querySelector(`.tab[data-status="${status}"]`);
            if (matchingTab) switchTab(matchingTab, status);
          } else {
            fetchTasks();
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function toggleDone(id, currentStatus) {
      const nextStatus = currentStatus === 'DONE' ? 'TODO' : 'DONE';
      await patchTask(id, { status: nextStatus });
    }

    async function changeStatus(id, newStatus) {
      await patchTask(id, { status: newStatus });
    }

    async function patchTask(id, bodyObj) {
      try {
        const res = await fetch(`${API_BASE}${id}/`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyObj)
        });
        if (res.ok) fetchTasks();
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteTask(id) {
      if (!confirm(`Delete task #${id}?`)) return;
      try {
        const res = await fetch(`${API_BASE}${id}/`, { method: 'DELETE' });
        if (res.ok) fetchTasks();
      } catch (e) {
        console.error(e);
      }
    }

    function openEditModal(id) {
      const task = cachedTasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-id').value = task.id;
      document.getElementById('edit-id-label').textContent = task.id;
      document.getElementById('edit-title').value = task.title;
      document.getElementById('edit-desc').value = task.description || '';
      document.getElementById('edit-status').value = task.status;
      document.getElementById('edit-priority').value = task.priority;
      document.getElementById('edit-due-date').value = task.due_date || '';

      document.getElementById('edit-modal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('open');
    }

    async function saveEdit(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const body = {
        title: document.getElementById('edit-title').value.trim(),
        description: document.getElementById('edit-desc').value.trim(),
        status: document.getElementById('edit-status').value,
        priority: document.getElementById('edit-priority').value,
        due_date: document.getElementById('edit-due-date').value || null
      };

      try {
        const res = await fetch(`${API_BASE}${id}/`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          closeEditModal();
          fetchTasks();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function switchTab(btn, status) {
      activeStatus = status;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      fetchTasks();
    }

    function searchTasks(val) {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        searchQuery = val.trim();
        fetchTasks();
      }, 250);
    }

    function escape(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
